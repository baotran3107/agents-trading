trading:
  symbol: "XAUUSD"
  timeframe_minutes: 5
  t_minus_seconds: 10
  active_hours:
    enabled: true
    start: "08:00"
    end: "22:00"
    timezone: "UTC"

risk:
  fixed_loss_usd: 250.0
  risk_reward_ratio: 2.0
  min_sl_points: 10.0
  max_sl_points: 500.0
  point_value_per_lot: 1.0  # For Gold (XAUUSD): 1 pip (0.10) on 1 lot = $10, 1 point (0.01) = $1

model:
  cli_path: "agy"
  model_name: "gemini-4-argon-low"
  timeout_seconds: 25
  retry_attempts: 1

telegram:
  enabled: true
  cooldown_minutes: 15
  send_watch_signals: true
  send_ready_signals: true

capture:
  window_title: "MetaTrader 5"
  black_threshold: 5.0
  output_dir: "data/captures"

mt5:
  mode: "auto" # "auto" (detect Windows MT5 or fallback to mock), "native", or "mock"

storage:
  db_path: "data/trading_agent.db"
  log_file: "data/cycles.jsonl"
  heartbeat_timeout_minutes: 15
